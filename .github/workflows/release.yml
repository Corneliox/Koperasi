name: Build & Release Windows 10/11

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v4.2)'
        required: true
        default: 'v4.2'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Executable & Inno Setup Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable with PyInstaller
        run: |
          python -m PyInstaller KoperasiBrimob.spec

      - name: Verify Executable Output
        shell: pwsh
        run: |
          if (Test-Path "dist/Koperasi.exe") {
            $size = [math]::Round((Get-Item "dist/Koperasi.exe").Length / 1MB, 2)
            Write-Host "SUCCESS: dist/Koperasi.exe built successfully ($size MB)"
          } else {
            Write-Error "ERROR: dist/Koperasi.exe was not created!"
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          if (Get-Command iscc.exe -ErrorAction SilentlyContinue) {
            iscc.exe setup.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" setup.iss
          } else {
            Write-Error "iscc.exe not found!"
            exit 1
          }

      - name: Verify Installer Output
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path . -Filter "Koperasi_Setup_*.exe"
          if ($installers.Count -gt 0) {
            foreach ($inst in $installers) {
              $size = [math]::Round($inst.Length / 1MB, 2)
              Write-Host "SUCCESS: Installer created -> $($inst.Name) ($size MB)"
            }
          } else {
            Write-Error "ERROR: Installer executable was not created!"
            exit 1
          }

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path . -Filter "Koperasi_Setup_*.exe") + @(Get-Item -Path "dist/Koperasi.exe")
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }
          $checksums | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Write-Host "SHA256 Checksums generated:"
          Get-Content "SHA256SUMS.txt"

      - name: Determine Release Tag
        id: get_tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
          } else {
            $tag = "v4.3"
          }
          Write-Host "Target Tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Sistem Koperasi ${{ steps.get_tag.outputs.tag }} (Windows 10/11 64-bit)"
          draft: false
          prerelease: false
          files: |
            Koperasi_Setup_*.exe
            dist/Koperasi.exe
            SHA256SUMS.txt
          body: |
            ## 🏛️ Sistem Koperasi Release ${{ steps.get_tag.outputs.tag }}
            ### 💻 Khusus Sistem Operasi Windows 10 / Windows 11 (64-Bit) - Offline / Lokal
            
            Versi 4.3 menghadirkan sistem autentikasi pendaftaran akun baru mandiri, enkripsi password lokal yang aman, netralisasi antarmuka, serta isolasi eksekusi 100% offline.

            ---

            ### 🚀 Apa yang Baru di Versi Ini:
            - **🔐 Sistem Autentikasi Register & Login Mandiri**: Pendaftaran akun pengguna mandiri dari layar awal dengan enkripsi password (SHA-256 + Salt). Akun pertama otomatis menjadi Super Administrator.
            - **🏢 Antarmuka Netral & Fleksibel**: Pembersihan penamaan khusus menjadi sistem manajemen koperasi simpan pinjam dan kasir POS yang profesional.
            - **⚡ Operasi 100% Offline / Mandiri**: Seluruh database, transaksi, struk, dan laporan tersimpan di penyimpanan lokal tanpa koneksi luar.
            - **🛡️ Stabilitas Maksimal**: Sanitasi input angka, pencegahan force close saat pengetikan cepat, dan konkurensi SQLite WAL.
            - **📊 Neraca & Struk Presisi**: Format struk kasir, invoice PDF, dan laporan keuangan neraca laba-rugi telah disinkronkan.

            ---

            ### 📦 File Unduhan:
            1. **Installer Setup (Disarankan)**: `Koperasi_Setup_v4.3.exe` (Instalasi otomatis + Shortcut Desktop).
            2. **Standalone Portable**: `Koperasi.exe` (Jalankan langsung tanpa instalasi).
            3. **Checksum Integritas**: `SHA256SUMS.txt`
